<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vopple.uk</title>

  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2366fcf1'/><stop offset='100%' stop-color='%2345a29e'/></linearGradient></defs><rect width='100' height='100' rx='25' fill='%230b0c10'/><path d='M40 70 A10 10 0 1 1 50 60 L50 25 L75 20 L75 35 L50 40' stroke='url(%23g)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='40' cy='70' r='8' fill='url(%23g)'/><circle cx='65' cy='55' r='8' fill='url(%23g)'/><path d='M75 20 L75 55' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .player-wrapper {
      position: relative;
      width: 92vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(102, 252, 241, 0.2);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .interaction-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      cursor: pointer;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <video id="player" autoplay loop playsinline controls preload="auto">
      <source src="rickroll.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div id="trigger-layer" class="interaction-overlay"></div>

  <script>
    const video = document.getElementById('player');
    const triggerLayer = document.getElementById('trigger-layer');

    function startInitialPlayback() {
      video.muted = true;
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          // Attempt unmuting immediately if browser policy allows
          video.muted = false;
          video.volume = 1.0;
        }).catch(() => {
          // Fall back to muted playback until first touch/click
          video.muted = true;
          video.play();
        });
      }
    }

    function unlockAudioAndPlay() {
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(console.error);

      if (triggerLayer) {
        triggerLayer.remove();
      }

      window.removeEventListener('pointerdown', unlockAudioAndPlay);
      window.removeEventListener('keydown', unlockAudioAndPlay);
      window.removeEventListener('touchstart', unlockAudioAndPlay);
    }

    window.addEventListener('DOMContentLoaded', startInitialPlayback);
    window.addEventListener('pointerdown', unlockAudioAndPlay, { once: true });
    window.addEventListener('keydown', unlockAudioAndPlay, { once: true });
    window.addEventListener('touchstart', unlockAudioAndPlay, { once: true });
  </script>
</body>
</html>
