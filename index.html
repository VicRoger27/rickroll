<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Never Gonna Give You Up</title>

  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2366fcf1'/><stop offset='100%' stop-color='%2345a29e'/></linearGradient></defs><rect width='100' height='100' rx='25' fill='%230b0c10'/><path d='M40 70 A10 10 0 1 1 50 60 L50 25 L75 20 L75 35 L50 40' stroke='url(%23g)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='40' cy='70' r='8' fill='url(%23g)'/><circle cx='65' cy='55' r='8' fill='url(%23g)'/><path d='M75 20 L75 55' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .player-wrapper {
      position: relative;
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(102, 252, 241, 0.15);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .unmute-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 40, 51, 0.9);
      border: 1px solid #66fcf1;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease-in-out;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .unmute-overlay:hover {
      background: #66fcf1;
      color: #0b0c10;
      transform: translateX(-50%) scale(1.05);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <video id="rickroll-video" autoplay loop playsinline controls>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button id="unmute-btn" class="unmute-overlay">
      <span>🔊 Tap to Unmute & Enjoy</span>
    </button>
  </div>

  <script>
    const video = document.getElementById('rickroll-video');
    const unmuteBtn = document.getElementById('unmute-btn');

    // Attempt autoplay with audio first; fallback to muted if blocked by browser policy
    video.play().then(() => {
      unmuteBtn.classList.add('hidden');
    }).catch(() => {
      video.muted = true;
      video.play();
      unmuteBtn.classList.remove('hidden');
    });

    unmuteBtn.addEventListener('click', () => {
      video.muted = false;
      video.play();
      unmuteBtn.classList.add('hidden');
    });

    video.addEventListener('volumechange', () => {
      if (!video.muted && video.volume > 0) {
        unmuteBtn.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
