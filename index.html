<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vopple.uk</title>

  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2366fcf1'/><stop offset='100%' stop-color='%2345a29e'/></linearGradient></defs><rect width='100' height='100' rx='25' fill='%230b0c10'/><path d='M40 70 A10 10 0 1 1 50 60 L50 25 L75 20 L75 35 L50 40' stroke='url(%23g)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='40' cy='70' r='8' fill='url(%23g)'/><circle cx='65' cy='55' r='8' fill='url(%23g)'/><path d='M75 20 L75 55' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .player-wrapper {
      position: relative;
      width: 92vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(102, 252, 241, 0.2);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000000;
    }

    .interaction-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      cursor: pointer;
      background: transparent;
    }

    .error-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      text-align: center;
      font-size: 1rem;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      border: 1px solid #ff6b6b;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <video 
      id="player" 
      src="https://raw.githubusercontent.com/VicRoger27/rickroll/main/rickroll.mp4" 
      autoplay 
      loop 
      playsinline 
      controls 
      preload="auto">
    </video>
    <div id="error" class="error-msg">
      ⚠️ Could not load the video stream.<br>
      Please check your network connection or repository access.
    </div>
  </div>

  <div id="trigger-layer" class="interaction-overlay"></div>

  <script>
    const video = document.getElementById('player');
    const triggerLayer = document.getElementById('trigger-layer');
    const errorMsg = document.getElementById('error');

    video.addEventListener('error', () => {
      errorMsg.style.display = 'block';
    });

    // Start playback immediately
    function startPlayback() {
      video.muted = true;
      video.play().then(() => {
        // Attempt unmuting right away
        video.muted = false;
      }).catch(() => {
        video.muted = true;
        video.play();
      });
    }

    // Unmute on first screen interaction
    function unlockAudio() {
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(console.error);

      if (triggerLayer) {
        triggerLayer.remove();
      }

      window.removeEventListener('pointerdown', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    }

    window.addEventListener('DOMContentLoaded', startPlayback);
    window.addEventListener('pointerdown', unlockAudio, { once: true });
    window.addEventListener('keydown', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });
  </script>
</body>
</html>
